<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Student — Al Beruniy International School</title>
  <link rel="stylesheet" href="style.css"/>
</head>
<body>

<header class="topbar">
  <div class="topbar-brand">
    <div class="topbar-title">
      <span>Al Beruniy International School</span>
      <span>Student Portal</span>
    </div>
  </div>
  <div class="topbar-right"><a href="index.html">← Home</a></div>
</header>

<!-- SCREEN 1 — INFO -->
<div id="sc-info">
  <div class="entry-wrap">
    <div class="auth-card">
      <div class="auth-head">
        <div class="auth-icon">🎓</div>
        <h2>Student Login</h2>
        <p>Enter your details to continue</p>
      </div>
      <div id="info-alert"></div>
      <div class="form-group"><label>First Name</label>
        <input type="text" id="s-ism" placeholder="Your first name"/></div>
      <div class="form-group"><label>Last Name</label>
        <input type="text" id="s-fam" placeholder="Your last name"/></div>
      <div class="form-row">
        <div class="form-group"><label>Grade</label>
          <select id="s-sinf">
            <option value="">Grade</option>
            <option>1</option><option>2</option><option>3</option><option>4</option>
            <option>5</option><option>6</option><option>7</option><option>8</option>
            <option>9</option><option>10</option><option>11</option>
          </select></div>
        <div class="form-group"><label>Class</label>
          <select id="s-harf">
            <option value="">Class</option>
            <option>A</option><option>B</option><option>C</option>
            <option>D</option><option>E</option>
          </select></div>
      </div>
      <button class="btn btn-primary btn-block" onclick="enterStudent()">Continue →</button>
    </div>
  </div>
</div>

<!-- SCREEN 2 — TEST LIST -->
<div id="sc-tests" style="display:none">
  <div class="page-wrap" style="max-width:680px">
    <div style="display:flex;align-items:center;gap:14px;margin-bottom:28px;flex-wrap:wrap">
      <button class="btn btn-ghost btn-sm" onclick="backToInfo()">← Back</button>
      <div>
        <div style="font-weight:800;font-size:1.05rem" id="st-name"></div>
        <div style="color:var(--muted);font-size:.82rem" id="st-class"></div>
      </div>
    </div>
    <div class="card">
      <div class="section-title">📋 Available Tests</div>
      <div id="test-list"><div class="loading">Loading...</div></div>
    </div>
  </div>
</div>

<!-- SCREEN 3 — EXAM -->
<div id="sc-exam" style="display:none">
  <div class="page-wrap" style="max-width:720px">
    <div class="exam-header">
      <h2 id="exam-title"></h2>
      <p  id="exam-meta"></p>
    </div>
    <div class="progress-wrap">
      <div class="progress-info">
        <span id="prog-label"></span><span id="prog-pct"></span>
      </div>
      <div class="progress-bar-bg">
        <div class="progress-bar" id="prog-bar" style="width:0%"></div>
      </div>
    </div>
    <div class="q-dots" id="q-dots"></div>
    <div id="question-card"></div>
    <div class="q-nav" style="margin-top:16px">
      <button class="btn btn-ghost" id="btn-prev" onclick="prevQ()">← Previous</button>
      <span class="q-nav-center" id="q-counter"></span>
      <button class="btn btn-primary" id="btn-next" onclick="nextQ()">Next →</button>
    </div>
    <div style="margin-top:14px">
      <button class="btn btn-success btn-block" id="btn-finish" style="display:none" onclick="finishExam()">
        ✅ Submit Test
      </button>
    </div>
  </div>
</div>

<!-- SCREEN 4 — SUBMITTED -->
<div id="sc-done" style="display:none">
  <div class="page-wrap" style="max-width:520px">
    <div class="card">
      <div class="submitted-wrap">
        <div class="s-icon">✅</div>
        <h2>Test submitted successfully!</h2>
        <p id="done-text"></p>
        <div style="margin-top:32px;display:flex;gap:12px;justify-content:center;flex-wrap:wrap">
          <button class="btn btn-outline" onclick="backToTests()">← Back to Tests</button>
          <button class="btn btn-primary" onclick="location.href='index.html'">🏠 Home</button>
        </div>
      </div>
    </div>
  </div>
</div>

<footer class="footer">© 2024 <span>Al Beruniy International School</span></footer>

<script>
const API = {
  get:  async url => { const r=await fetch(url); return r.json() },
  post: async (url,body) => { const r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}); return r.json() }
}

let student=null, exam=null, answers={}, curQ=0

const $=id=>document.getElementById(id)
const show=id=>$(id).style.display='block'
const hide=id=>$(id).style.display='none'
const al=(id,msg,t='error')=>$(id).innerHTML=`<div class="alert alert-${t}">${msg}</div>`

async function enterStudent(){
  const ism=$('s-ism').value.trim(), fam=$('s-fam').value.trim()
  const sinf=$('s-sinf').value, harf=$('s-harf').value
  if(!ism||!fam||!sinf||!harf) return al('info-alert','⚠️ Please fill in all fields')
  student={ism,fam,sinf,harf,fullName:ism+' '+fam}
  $('st-name').textContent='🎓 '+student.fullName
  $('st-class').textContent='Grade '+sinf+'-'+harf
  hide('sc-info'); show('sc-tests')
  await renderTestList()
}

function backToInfo(){ hide('sc-tests'); show('sc-info') }

async function renderTestList(){
  $('test-list').innerHTML='<div class="loading">Loading tests...</div>'
  const tests = await API.get(`/api/tests?sinf=${student.sinf}&harf=${student.harf}`)
  const el=$('test-list')
  if(!tests.length){
    el.innerHTML=`<div class="empty-state"><span class="es-icon">📭</span><p>No tests available for your class yet.</p></div>`
    return
  }

  // Check which ones are already done
  const checks = await Promise.all(tests.map(t=>
    API.get(`/api/results/check?testId=${t.id}&studentName=${encodeURIComponent(student.fullName)}&sinf=${student.sinf}&harf=${student.harf}`)
  ))

  el.innerHTML=tests.map((t,i)=>{
    if(checks[i]?.exists){
      return `<div class="list-item done">
        <div class="list-item-icon green">✅</div>
        <div class="list-item-body">
          <h4>${t.nomi}</h4>
          <p>👨‍🏫 ${t.teacher_name} · 📚 ${t.fan} · ❓ ${t.questions.length} questions</p>
        </div>
        <div class="list-item-right"><span class="badge badge-green">Submitted ✓</span></div>
      </div>`
    }
    return `<div class="list-item clickable" onclick="startTest('${t.id}')">
      <div class="list-item-icon">📋</div>
      <div class="list-item-body">
        <h4>${t.nomi}</h4>
        <p>👨‍🏫 ${t.teacher_name} · 📚 ${t.fan} · ❓ ${t.questions.length} questions</p>
      </div>
      <div class="list-item-right">
        <span class="badge badge-blue">Grade ${t.sinf}-${t.harf}</span>
        <div style="font-size:.8rem;color:var(--blue);font-weight:700;margin-top:4px">Start →</div>
      </div>
    </div>`
  }).join('')
}

async function startTest(id){
  const tests = await API.get('/api/tests?sinf='+student.sinf+'&harf='+student.harf)
  const test=tests.find(t=>t.id===id); if(!test) return

  const chk=await API.get(`/api/results/check?testId=${id}&studentName=${encodeURIComponent(student.fullName)}&sinf=${student.sinf}&harf=${student.harf}`)
  if(chk.exists){ alert('You have already submitted this test!'); return }

  exam=test; answers={}; curQ=0
  $('exam-title').textContent=test.nomi
  $('exam-meta').textContent=`👨‍🏫 ${test.teacher_name}  ·  📚 ${test.fan}  ·  ❓ ${test.questions.length} questions`
  hide('sc-tests'); show('sc-exam'); renderQ()
}

function renderQ(){
  const q=exam.questions[curQ], tot=exam.questions.length
  const answered=Object.keys(answers).length
  const pct=Math.round((answered/tot)*100)
  $('prog-label').textContent=`${answered}/${tot} answered`
  $('prog-pct').textContent=pct+'%'
  $('prog-bar').style.width=pct+'%'
  $('q-counter').textContent=`${curQ+1} / ${tot}`
  $('q-dots').innerHTML=exam.questions.map((_,i)=>{
    let cls='q-dot'
    if(answers[i]!==undefined) cls+=' answered'
    if(i===curQ) cls+=' current'
    return `<div class="${cls}" onclick="jumpQ(${i})">${i+1}</div>`
  }).join('')

  const isOpen=q.type==='open'
  let html=`<div class="question-card">
    <div class="q-num">Question ${curQ+1} / ${tot}</div>
    <div class="q-text">${q.text}</div>`
  if(isOpen){
    html+=`<div class="open-answer">
      <label style="font-size:.8rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.3px;margin-bottom:6px;display:block">Write your answer below</label>
      <textarea id="open-ans" placeholder="Type your answer here..."
        onInput="answers[${curQ}]=this.value;updateNav()">${answers[curQ]||''}</textarea>
    </div>`
  } else {
    const sel=answers[curQ]
    ;['a','b','c','d'].forEach(k=>{
      const labels={a:'A',b:'B',c:'C',d:'D'}
      html+=`<label class="option-label${sel===k?' selected':''}">
        <input type="radio" name="opt" value="${k}" ${sel===k?'checked':''} onchange="selectAns('${k}')"/>
        <span class="opt-key">${labels[k]}</span>
        <span>${q.options[k]}</span>
      </label>`
    })
  }
  html+='</div>'
  $('question-card').innerHTML=html; updateNav()
}

function updateNav(){
  const tot=exam.questions.length, allDone=Object.keys(answers).length===tot
  $('btn-prev').disabled=curQ===0; $('btn-prev').style.opacity=curQ===0?'.4':'1'
  curQ===tot-1?hide('btn-next'):show('btn-next')
  allDone?show('btn-finish'):hide('btn-finish')
}

function selectAns(val){ answers[curQ]=val; renderQ() }
function jumpQ(i){ curQ=i; renderQ() }
function prevQ(){ if(curQ>0){ curQ--; renderQ() } }
function nextQ(){ if(curQ<exam.questions.length-1){ curQ++; renderQ() } }

async function finishExam(){
  if(!confirm('Submit the test? You cannot undo this.')) return
  $('btn-finish').disabled=true; $('btn-finish').textContent='⏳ Submitting...'

  let score=0, total=0
  const answerLog=exam.questions.map((q,i)=>{
    const given=answers[i]!==undefined?answers[i]:null
    if(q.type==='test'){
      total++
      const isOk=given===q.correct; if(isOk) score++
      return {type:'test',question:q.text,given,givenText:given?q.options[given]:null,
        correct:q.correct,correctText:q.options[q.correct],isOk}
    }
    return {type:'open',question:q.text,given:given||''}
  })
  const pct=total>0?Math.round((score/total)*100):null
  const grade=pct===null?'Open-ended':pct>=86?"5 (Excellent)":pct>=71?"4 (Good)":pct>=56?"3 (Satisfactory)":"2 (Unsatisfactory)"

  const res=await API.post('/api/results',{
    testId:exam.id, testNomi:exam.nomi, teacherId:exam.teacher_id,
    studentName:student.fullName, sinf:student.sinf, harf:student.harf,
    score, total, pct, grade, answers:answerLog
  })

  if(res.error){ alert('Error: '+res.error); $('btn-finish').disabled=false; $('btn-finish').textContent='✅ Submit Test'; return }

  $('done-text').innerHTML=
    `<strong>${student.fullName}</strong> — Grade ${student.sinf}-${student.harf}<br/>
     <span style="color:var(--muted);font-size:.88rem">📋 ${exam.nomi}<br/>Your result will be reviewed by your teacher.</span>`
  hide('sc-exam'); show('sc-done')
}

function backToTests(){ hide('sc-done'); show('sc-tests'); renderTestList() }
</script>
</body>
</html>
