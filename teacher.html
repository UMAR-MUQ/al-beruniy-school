<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Teacher — Al Beruniy International School</title>
  <link rel="stylesheet" href="style.css?v=20261017"/>
</head>
<body>

<header class="topbar">
  <div class="topbar-brand">
    <div class="topbar-title">
      <span>Al Beruniy International School</span>
    </div>
  </div>
  <div class="topbar-right" id="topbar-right">
    <a href="index.html">← Home</a>
  </div>
</header>

<!-- AUTH -->
<div id="auth-screen" style="flex:1;display:flex;flex-direction:column">
  <div class="auth-wrap">
    <div class="auth-card">
      <div class="auth-head">
        <div class="auth-icon">👨‍🏫</div>
        <h2>Teacher Portal</h2>
        <p>Sign in or create an account</p>
      </div>
      <div class="tabs">
        <button class="tab-btn active" onclick="authTab('login',this)">🔑 Sign In</button>
        <button class="tab-btn"        onclick="authTab('reg',this)">📝 Register</button>
      </div>

      <!-- LOGIN -->
      <div id="tp-login" class="tab-panel active">
        <div id="login-alert"></div>
        <div class="form-group"><label>First Name</label>
          <input type="text" id="l-ism" placeholder="Your first name"/></div>
        <div class="form-group"><label>Last Name</label>
          <input type="text" id="l-fam" placeholder="Your last name"/></div>
        <div class="form-group"><label>Subject</label>
          <select id="l-fan">
            <option value="">— Select subject —</option>
            <option value="Physics">Physics</option>
            <option value="Chemistry">Chemistry</option>
            <option value="Biology">Biology</option>
            <option value="Literature">Literature</option>
            <option value="English">English</option>
            <option value="Russian">Russian</option>
            <option value="History">History</option>
            <option value="Geography">Geography</option>
            <option value="Computer Science">Computer Science</option>
            <option value="Music">Music</option>
            <option value="Art">Art</option>
          </select></div>
        <div class="form-group"><label>Password</label>
          <input type="password" id="l-par" placeholder="Your password"
            onkeydown="if(event.key==='Enter')doLogin()"/></div>
        <button class="btn btn-primary btn-block" id="btn-login" onclick="doLogin()">🔑 Sign In</button>
      </div>

      <!-- REGISTER -->
      <div id="tp-reg" class="tab-panel">
        <div id="reg-alert"></div>
        <div class="form-group"><label>First Name</label>
          <input type="text" id="r-ism" placeholder="Your first name"/></div>
        <div class="form-group"><label>Last Name</label>
          <input type="text" id="r-fam" placeholder="Your last name"/></div>
        <div class="form-group"><label>Subject</label>
          <select id="r-fan">
            <option value="">— Select subject —</option>
            <option value="Physics">Physics</option>
            <option value="Chemistry">Chemistry</option>
            <option value="Biology">Biology</option>
            <option value="Literature">Literature</option>
            <option value="English">English</option>
            <option value="Russian">Russian</option>
            <option value="History">History</option>
            <option value="Geography">Geography</option>
            <option value="Computer Science">Computer Science</option>
            <option value="Music">Music</option>
            <option value="Art">Art</option>
          </select></div>
        <div class="form-group"><label>Password</label>
          <input type="password" id="r-par" placeholder="At least 4 characters"/></div>
        <div class="form-group"><label>Confirm Password</label>
          <input type="password" id="r-par2" placeholder="Repeat password"/></div>
        <button class="btn btn-gold btn-block" id="btn-reg" onclick="doRegister()">✅ Create Account</button>
      </div>
    </div>
  </div>
</div>

<!-- DASHBOARD -->
<div id="dashboard" style="flex:1;flex-direction:column;display:none">
  <div class="page-wrap">
    <div class="welcome-banner">
      <div class="wb-avatar">👨‍🏫</div>
      <div class="wb-info">
        <h2 id="wb-name">—</h2>
        <p id="wb-sub">—</p>
      </div>
      <div class="wb-badge" id="wb-badge">Subject</div>
      <button class="btn btn-ghost btn-sm" style="margin-left:auto" onclick="logout()">🚪 Sign Out</button>
    </div>

    <div class="dash-nav">
      <button class="dash-nav-btn active" onclick="goPanel('p-tests',this)">📋 My Tests</button>
      <button class="dash-nav-btn"        onclick="goPanel('p-add',this)">➕ Add Test</button>
      <button class="dash-nav-btn"        onclick="goPanel('p-students',this)">👦 Students</button>
      <button class="dash-nav-btn"        onclick="goPanel('p-results',this)">📊 Results</button>
    </div>

    <div id="p-tests" class="dash-panel active">
      <div class="card">
        <div class="section-title">📋 My Tests</div>
        <div id="my-tests"><div class="loading">Loading...</div></div>
      </div>
    </div>

    <div id="p-add" class="dash-panel">
      <div class="card">
        <div class="section-title">➕ Create New Test</div>
        <div id="add-alert"></div>
        <div class="form-group"><label>Test Name</label>
          <input type="text" id="t-nomi" placeholder="e.g. Grade 7 Physics – Quarter 1"/></div>
        <div class="form-row">
          <div class="form-group"><label>Grade</label>
            <select id="t-sinf">
              <option value="">Grade</option>
              <option>1</option><option>2</option><option>3</option><option>4</option>
              <option>5</option><option>6</option><option>7</option><option>8</option>
              <option>9</option><option>10</option><option>11</option>
            </select></div>
          <div class="form-group"><label>Class</label>
            <select id="t-harf">
              <option value="">Class</option>
              <option>A</option><option>B</option><option>C</option>
              <option>D</option><option>E</option><option>All</option>
            </select></div>
        </div>
        <hr class="divider"/>
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px">
          <div style="font-weight:800;color:var(--text);font-size:.95rem">📝 Questions</div>
          <button class="btn btn-outline btn-sm" onclick="addQ()">+ Add Question</button>
        </div>
        <div id="q-container"></div>
        <button class="btn btn-primary btn-block" style="margin-top:8px" id="btn-save" onclick="saveTest()">💾 Save Test</button>
      </div>
    </div>

    <div id="p-students" class="dash-panel">
      <div class="card">
        <div class="section-title">👦 Students</div>
        <div id="students-list"><div class="loading">Loading...</div></div>
      </div>
    </div>

    <div id="p-results" class="dash-panel">
      <div class="card">
        <div class="section-title">📊 Results</div>
        <div style="margin-bottom:16px">
          <select id="filter-test" style="max-width:340px" onchange="renderResults()">
            <option value="">— All Tests —</option>
          </select>
        </div>
        <div id="results-list"><div class="loading">Loading...</div></div>
      </div>
    </div>
  </div>
</div>

<!-- MODAL -->
<div class="modal-overlay" id="modal-overlay" onclick="closeModal(event)">
  <div class="modal">
    <div class="modal-head">
      <div class="modal-head-info">
        <h3 id="modal-title">—</h3>
        <p  id="modal-sub">—</p>
      </div>
      <button class="modal-close" onclick="closeModalDirect()">✕</button>
    </div>
    <div class="modal-body" id="modal-body"></div>
  </div>
</div>

<footer class="footer">© 2024 <span>Al Beruniy International School</span></footer>

<script>
/* ── API ── */
const API = {
  post: async (url, body) => {
    const r = await fetch(url, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body) })
    return r.json()
  },
  get:  async (url) => { const r = await fetch(url); return r.json() },
  del:  async (url) => { const r = await fetch(url, { method:'DELETE' }); return r.json() }
}

/* ── SESSION ── */
let ME = null
function saveMe(t){ ME=t; localStorage.setItem('mp_me', JSON.stringify(t)) }
function loadMe(){ try{ return JSON.parse(localStorage.getItem('mp_me')||'null') }catch(e){ return null } }
function logout(){ localStorage.removeItem('mp_me'); location.reload() }

/* ── HELPERS ── */
const $ = id => document.getElementById(id)
const al = (id,msg,t='error') => $(id).innerHTML=`<div class="alert alert-${t}">${msg}</div>`
const clr= id => $(id).innerHTML=''
const setLoading = (btnId, loading, txt='') => {
  const b=$(btnId); if(!b) return
  b.disabled=loading; b.style.opacity=loading?'.6':'1'
  if(txt) b.textContent=loading?'⏳ Please wait...':txt
}

function authTab(tab,btn){
  ['login','reg'].forEach(t=> $('tp-'+t).classList.toggle('active',t===tab))
  document.querySelectorAll('#auth-screen .tab-btn').forEach(b=>b.classList.remove('active'))
  btn.classList.add('active')
}

/* ── REGISTER ── */
async function doRegister(){
  clr('reg-alert')
  const ism=$('r-ism').value.trim(), fam=$('r-fam').value.trim()
  const fan=$('r-fan').value, par=$('r-par').value, par2=$('r-par2').value
  if(!ism||!fam||!fan||!par||!par2) return al('reg-alert','⚠️ Please fill in all fields')
  if(par.length<4) return al('reg-alert','⚠️ Password must be at least 4 characters')
  if(par!==par2)   return al('reg-alert','⚠️ Passwords do not match')

  setLoading('btn-reg', true, '✅ Create Account')
  const res = await API.post('/api/teachers/register', { ism, familiya:fam, fan, parol:par })
  setLoading('btn-reg', false, '✅ Create Account')

  if(res.error) return al('reg-alert','⚠️ '+res.error)
  al('reg-alert','✅ Registered successfully! Please sign in.','success')
  $('l-ism').value=ism; $('l-fam').value=fam; $('l-fan').value=fan
  authTab('login', document.querySelector('#auth-screen .tab-btn'))
}

/* ── LOGIN ── */
async function doLogin(){
  clr('login-alert')
  const ism=$('l-ism').value.trim(), fam=$('l-fam').value.trim()
  const fan=$('l-fan').value, par=$('l-par').value
  if(!ism||!fam||!fan||!par) return al('login-alert','⚠️ Please fill in all fields')

  setLoading('btn-login', true, '🔑 Sign In')
  const res = await API.post('/api/teachers/login', { ism, familiya:fam, fan, parol:par })
  setLoading('btn-login', false, '🔑 Sign In')

  if(res.error) return al('login-alert','❌ '+res.error)
  saveMe(res.teacher)
  openDashboard(res.teacher)
}

/* ── DASHBOARD ── */
function openDashboard(t){
  $('auth-screen').style.display='none'
  $('dashboard').style.display='block'
  $('wb-name').textContent=t.ism+' '+t.familiya
  $('wb-sub').textContent='📚 '+t.fan+' teacher'
  $('wb-badge').textContent=t.fan
  $('topbar-right').innerHTML=`<span class="topbar-user">${t.ism} ${t.familiya}</span><a href="index.html">← Home</a>`
  loadMyTests(t)
}

function goPanel(id,btn){
  document.querySelectorAll('.dash-panel').forEach(p=>p.classList.remove('active'))
  document.querySelectorAll('.dash-nav-btn').forEach(b=>b.classList.remove('active'))
  $(id).classList.add('active'); btn.classList.add('active')
  if(!ME) return
  if(id==='p-tests')    loadMyTests(ME)
  if(id==='p-students') loadStudents(ME)
  if(id==='p-results')  { loadResults(ME) }
}

/* ── MY TESTS ── */
async function loadMyTests(t){
  $('my-tests').innerHTML='<div class="loading">Loading...</div>'
  const tests = await API.get('/api/tests/teacher/'+t.id)
  renderMyTests(tests)
}

function renderMyTests(tests){
  const el=$('my-tests')
  if(!tests.length){
    el.innerHTML=`<div class="empty-state"><span class="es-icon">📭</span><p>No tests yet. Go to "Add Test".</p></div>`
    return
  }
  el.innerHTML=tests.map(ts=>`
    <div class="list-item">
      <div class="list-item-icon">📋</div>
      <div class="list-item-body">
        <h4>${ts.nomi}</h4>
        <p>Grade ${ts.sinf}-${ts.harf} · ${ts.questions.length} questions</p>
      </div>
      <div class="list-item-right">
        <span class="badge badge-blue">${ts.sinf}-${ts.harf}</span>
        <button class="btn btn-danger btn-sm" onclick="delTest('${ts.id}')">🗑</button>
      </div>
    </div>`).join('')
}

async function delTest(id){
  if(!confirm('Delete this test?')) return
  await API.del('/api/tests/'+id)
  loadMyTests(ME)
}

/* ── ADD TEST ── */
let qc=0
function addQ(){
  qc++; const n=qc
  const div=document.createElement('div')
  div.className='q-block-add'; div.id='qb-'+n
  div.innerHTML=`
    <div class="q-block-head">
      <span class="q-label-tag">Question #${n}</span>
      <div style="display:flex;gap:8px;align-items:center">
        <div style="display:flex;gap:6px">
          <button class="qtype-btn on" id="qbt-test-${n}" onclick="switchQType(${n},'test')">Multiple Choice</button>
          <button class="qtype-btn"    id="qbt-open-${n}" onclick="switchQType(${n},'open')">Open-ended</button>
        </div>
        <button class="btn btn-danger btn-sm" onclick="rmQ(${n})">✕</button>
      </div>
    </div>
    <div class="form-group"><label>Question Text</label>
      <textarea id="qt-${n}" placeholder="Write the question here..."></textarea>
    </div>
    <div id="qopts-${n}">
      <div class="opts-wrap">
        <div class="opt-r"><span class="ok">A</span><input type="text" id="qa-${n}" placeholder="Option A"/></div>
        <div class="opt-r"><span class="ok">B</span><input type="text" id="qb-${n}" placeholder="Option B"/></div>
        <div class="opt-r"><span class="ok">C</span><input type="text" id="qc-${n}" placeholder="Option C"/></div>
        <div class="opt-r"><span class="ok">D</span><input type="text" id="qd-${n}" placeholder="Option D"/></div>
      </div>
      <div class="cor-row">
        <label>✅ Correct Answer:</label>
        <select id="qcor-${n}">
          <option value="a">A</option><option value="b">B</option>
          <option value="c">C</option><option value="d">D</option>
        </select>
      </div>
    </div>`
  $('q-container').appendChild(div)
}

function switchQType(n,type){
  $('qbt-test-'+n).classList.toggle('on',type==='test')
  $('qbt-open-'+n).classList.toggle('on',type==='open')
  $('qopts-'+n).innerHTML = type==='open'
    ? `<div class="form-group"><label>Student writes a free-form answer (you review manually)</label></div>`
    : `<div class="opts-wrap">
        <div class="opt-r"><span class="ok">A</span><input type="text" id="qa-${n}" placeholder="Option A"/></div>
        <div class="opt-r"><span class="ok">B</span><input type="text" id="qb-${n}" placeholder="Option B"/></div>
        <div class="opt-r"><span class="ok">C</span><input type="text" id="qc-${n}" placeholder="Option C"/></div>
        <div class="opt-r"><span class="ok">D</span><input type="text" id="qd-${n}" placeholder="Option D"/></div>
      </div>
      <div class="cor-row">
        <label>✅ Correct Answer:</label>
        <select id="qcor-${n}">
          <option value="a">A</option><option value="b">B</option>
          <option value="c">C</option><option value="d">D</option>
        </select>
      </div>`
}

function rmQ(n){ const e=$('qb-'+n); if(e) e.remove() }

async function saveTest(){
  clr('add-alert')
  const nomi=$('t-nomi').value.trim(), sinf=$('t-sinf').value, harf=$('t-harf').value
  if(!nomi||!sinf||!harf) return al('add-alert','⚠️ Enter test name, grade and class')
  const rows=document.querySelectorAll('#q-container .q-block-add')
  if(!rows.length) return al('add-alert','⚠️ Add at least 1 question')
  const questions=[]; let valid=true
  rows.forEach(row=>{
    const n=row.id.replace('qb-','')
    const isOpen=$('qbt-open-'+n)?.classList.contains('on')
    const text=$('qt-'+n)?.value.trim()
    if(!text){ valid=false; return }
    if(isOpen){ questions.push({type:'open',text}) }
    else {
      const a=$('qa-'+n)?.value.trim(), b=$('qb-'+n)?.value.trim()
      const c=$('qc-'+n)?.value.trim(), d=$('qd-'+n)?.value.trim()
      const cor=$('qcor-'+n)?.value
      if(!a||!b||!c||!d){ valid=false; return }
      questions.push({type:'test',text,options:{a,b,c,d},correct:cor})
    }
  })
  if(!valid) return al('add-alert','⚠️ Fill in all questions and options')

  setLoading('btn-save', true, '💾 Save Test')
  const res = await API.post('/api/tests', {
    teacherId: ME.id, teacherName: ME.ism+' '+ME.familiya,
    fan: ME.fan, nomi, sinf, harf, questions
  })
  setLoading('btn-save', false, '💾 Save Test')

  if(res.error) return al('add-alert','❌ '+res.error)
  $('t-nomi').value=''; $('t-sinf').value=''; $('t-harf').value=''
  $('q-container').innerHTML=''; qc=0
  al('add-alert','✅ Test saved successfully!','success')
  loadMyTests(ME)
}

/* ── STUDENTS ── */
async function loadStudents(t){
  $('students-list').innerHTML='<div class="loading">Loading...</div>'
  const res = await API.get('/api/results/teacher/'+t.id)
  const el=$('students-list')
  if(!res.length){
    el.innerHTML=`<div class="empty-state"><span class="es-icon">👥</span><p>No students have submitted a test yet.</p></div>`
    return
  }
  const seen=new Set(); const uniq=[]
  res.forEach(r=>{ const k=r.student_name+'|'+r.sinf+'|'+r.harf
    if(!seen.has(k)){ seen.add(k); uniq.push(r) } })
  el.innerHTML=uniq.map(r=>{
    const cnt=res.filter(x=>x.student_name===r.student_name&&x.sinf===r.sinf&&x.harf===r.harf).length
    const initials=r.student_name.split(' ').map(w=>w[0]||'').join('').slice(0,2).toUpperCase()
    return `<div class="list-item clickable" onclick="showStudentDetail('${encodeURIComponent(r.student_name)}','${r.sinf}','${r.harf}')">
      <div class="list-item-icon navy">${initials}</div>
      <div class="list-item-body">
        <h4>${r.student_name}</h4>
        <p>Grade ${r.sinf}-${r.harf} · ${cnt} test(s) submitted</p>
      </div>
      <div class="list-item-right">
        <span class="badge badge-navy">${cnt} test(s)</span>
        <span style="color:var(--blue);font-size:.82rem;font-weight:600">View →</span>
      </div>
    </div>`
  }).join('')
}

/* ── STUDENT DETAIL MODAL ── */
async function showStudentDetail(encodedName, sinf, harf){
  const name=decodeURIComponent(encodedName)
  $('modal-title').textContent=name
  $('modal-sub').textContent='Grade '+sinf+'-'+harf
  $('modal-body').innerHTML='<div class="loading">Loading...</div>'
  $('modal-overlay').classList.add('open')

  const allRes = await API.get('/api/results/teacher/'+ME.id)
  const res = allRes.filter(r=>r.student_name===name&&r.sinf===sinf&&r.harf===harf)

  let html=''
  res.forEach(r=>{
    const pct=r.total>0?Math.round((r.score/r.total)*100):0
    const bt=pct>=80?'green':pct>=50?'gold':'red'
    html+=`<div style="margin-bottom:20px">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;flex-wrap:wrap;gap:8px">
        <div>
          <div style="font-weight:800;font-size:.95rem">📋 ${r.test_nomi}</div>
          <div style="font-size:.78rem;color:var(--muted);margin-top:2px">🕐 ${r.date_str}</div>
        </div>
        <div style="text-align:right">
          <div style="font-size:1.1rem;font-weight:900;color:var(--navy)">${r.score}/${r.total}</div>
          <span class="badge badge-${bt}">${pct}% · ${r.grade||''}</span>
        </div>
      </div>`
    if(r.answers?.length){
      r.answers.forEach((ans,i)=>{
        if(ans.type==='open'){
          html+=`<div class="answer-item open"><div class="ai-q">${i+1}. ${ans.question}</div>
            <div class="ai-a">✏️ Answer: <b>${ans.given||'(not answered)'}</b></div></div>`
        } else {
          const isOk=ans.given===ans.correct
          html+=`<div class="answer-item ${isOk?'ok':'fail'}"><div class="ai-q">${i+1}. ${ans.question}</div>
            <div class="ai-a">${isOk
              ?`✅ Correct: <b>${ans.correct?.toUpperCase()}) ${ans.correctText||''}</b>`
              :`❌ Given: <b>${ans.given?ans.given.toUpperCase()+') '+(ans.givenText||''):'(no answer)'}</b> · ✅ Correct: <b>${ans.correct?.toUpperCase()}) ${ans.correctText||''}</b>`
            }</div></div>`
        }
      })
    }
    html+='</div><hr class="divider"/>'
  })
  $('modal-body').innerHTML=html||'<div class="empty-state"><p>No results.</p></div>'
}

function closeModal(e){ if(e.target===$('modal-overlay')) closeModalDirect() }
function closeModalDirect(){ $('modal-overlay').classList.remove('open') }

/* ── RESULTS ── */
async function loadResults(t){
  $('results-list').innerHTML='<div class="loading">Loading...</div>'
  const [tests, res] = await Promise.all([
    API.get('/api/tests/teacher/'+t.id),
    API.get('/api/results/teacher/'+t.id)
  ])
  // fill filter
  const sel=$('filter-test')
  sel.innerHTML='<option value="">— All Tests —</option>'
  tests.forEach(t=>{ const o=document.createElement('option'); o.value=t.id; o.textContent=t.nomi; sel.appendChild(o) })
  window._allResults=res
  renderResults()
}

function renderResults(){
  const fid=$('filter-test')?.value||''
  let res=(window._allResults||[]).filter(r=>!fid||r.test_id===fid)
  res=res.sort((a,b)=>b.time-a.time)
  const el=$('results-list')
  if(!res.length){
    el.innerHTML=`<div class="empty-state"><span class="es-icon">📭</span><p>No results yet.</p></div>`
    return
  }
  el.innerHTML=res.map(r=>{
    const pct=r.total>0?Math.round((r.score/r.total)*100):0
    const bt=pct>=80?'green':pct>=50?'gold':'red'
    return `<div class="result-row"
      onclick="showStudentDetail('${encodeURIComponent(r.student_name)}','${r.sinf}','${r.harf}')">
      <div class="rr-left">
        <div class="rr-name">👦 ${r.student_name}</div>
        <div class="rr-meta">Grade ${r.sinf}-${r.harf} · 📋 ${r.test_nomi} · 🕐 ${r.date_str}</div>
      </div>
      <div class="rr-score">
        <div class="score-big">${r.score}/${r.total}</div>
        <span class="badge badge-${bt}">${pct}% · ${r.grade||''}</span>
      </div>
    </div>`
  }).join('')
}

  ME=loadMe()
  if(ME) openDashboard(ME)
  else   addQ()

</script>
